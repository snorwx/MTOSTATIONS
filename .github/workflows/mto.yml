# Collects the Ontario MTO road weather stations every 10 minutes and publishes them as one file on the
# "data" branch, which the site reads from raw.githubusercontent.com. Nothing is rebuilt or redeployed.
# Each round also collects the last three hours of mPING reports (scripts/build-mping.mjs) when the MPING_TOKEN secret is set.
# Each round also collects the SIGMETs and AIRMETs in force over Canada (scripts/build-aviation.mjs).
# Each round also collects the newest aerodrome forecast (TAF) for each Canadian aerodrome (scripts/build-taf.mjs).
# Each round also collects the newest weather report from each Canadian aerodrome (scripts/build-metar.mjs) and the
# past six hours of pilot reports over Canada (scripts/build-pirep.mjs).
# Each run also checks for a new daily snow and ice analysis (scripts/build-snow.mjs) and publishes it beside them.
# GitHub's own timer proved unreliable here, so each run collects six times, ten minutes apart, and then
# starts the next run itself. The hourly timer is only a backup that restarts the chain if it ever breaks.
name: MTO stations
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: mto
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the history published so far
        run: |
          git clone -q --depth 1 -b data "https://github.com/${{ github.repository }}.git" out || mkdir -p out
          rm -rf out/.git
      - name: Fetch today's snow and ice analysis, if it is new
        run: node scripts/build-snow.mjs out/snow.bin.gz || echo "snow and ice failed this run"
      - name: Collect and publish, six times
        run: |
          for round in 1 2 3 4 5 6; do
            node scripts/build-mping.mjs out/mping.json || echo "mPING failed this round"
            node scripts/build-aviation.mjs out/aviation.json || echo "aviation failed this round"
            node scripts/build-taf.mjs out/taf.json || echo "TAFs failed this round"
            node scripts/build-metar.mjs out/metar.json || echo "METARs failed this round"
            node scripts/build-pirep.mjs out/pireps.json || echo "pilot reports failed this round"
            if node scripts/build-mto.mjs out/mto.json; then
              (
                cd out
                rm -rf .git
                git init -q -b data
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A .
                git commit -q -m "MTO stations $(date -u +%FT%RZ)"
                # one commit only, replaced each time, so the branch never grows
                git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
              ) || echo "publishing failed this round"
            else
              echo "collecting failed this round"
            fi
            [ "$round" = 6 ] || sleep 590
          done
        env:
          MPING_TOKEN: ${{ secrets.MPING_TOKEN }}
      - name: Start the next run
        if: ${{ !cancelled() }}
        run: |
          sleep 570
          gh workflow run mto.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
