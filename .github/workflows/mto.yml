# Every 10 minutes: collect the Ontario MTO road weather stations and publish them as one file on the
# "data" branch, which the site reads from raw.githubusercontent.com. Nothing is rebuilt or redeployed.
name: MTO stations
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mto
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-mto.mjs out/mto.json
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mto.json
          git commit -q -m "MTO stations $(date -u +%FT%RZ)"
          # one commit only, replaced each run, so the branch never grows
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
